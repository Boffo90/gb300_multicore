on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'canary*'

name: Create Canary Release

jobs:
  build:
    name: Create Canary Release
    runs-on: ubuntu-22.04
    container:
        image: prosty/gb300-multicore-builder:v1.1-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: false
      - name: Fetch submodules (tolerant of broken optional deps)
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # top-level submodules: cores, assets/coreconfig, libs/libretro-common
          git submodule update --init --jobs 4
          # all core submodules inside 'cores' (first level; every one is on GitHub)
          git -C cores submodule update --init --jobs 8
          # recurse into any core that bundles its own git deps, but tolerate
          # unreachable ones (e.g. ecwolf's Bitbucket SDL deps — that core is not built)
          git submodule foreach --recursive 'git submodule update --init --jobs 4 || true' || true
      - name: Build the release
        run: ./.github/scripts/entrypoint.sh
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          prerelease: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: /__w/gb300_multicore/gb300_multicore/gb300-multicore-canary.tar.gz
          asset_name: gb300-multicore-${{ github.ref }}.tar.gz
          tag: ${{ github.ref }}
          overwrite: true
          body: |
              Canary (unstable) build of GB300 multicore. It contains latest, untested, changes to the emulation cores.
              Please only use this release prior to backing up your SD card. Kindly report bugs @ our discord server. 